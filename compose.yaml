services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invoice_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-invoice}
      - DB_USERNAME=${DB_USERNAME:-invoice}
      - DB_PASSWORD=${DB_PASSWORD:-invoice}
    depends_on:
      - postgres
    networks:
      - invoice

  nginx:
    image: nginx:alpine
    container_name: invoice_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - invoice

  postgres:
    image: postgres:16-alpine
    container_name: invoice_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_DATABASE:-invoice}
      - POSTGRES_USER=${DB_USERNAME:-invoice}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-invoice}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5433}:5432"
    networks:
      - invoice

volumes:
  postgres_data:

networks:
  invoice:
    driver: bridge